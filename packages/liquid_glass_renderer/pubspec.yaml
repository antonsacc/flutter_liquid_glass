name: liquid_glass_renderer
description: The raw renderer for a liquid glass effect in Flutter.
version: 0.2.0-dev.4

homepage: https://whynotmake.it
repository: https://github.com/whynotmake-it/flutter_liquid_glass/tree/main/packages/liquid_glass_renderer
screenshots:
  - description: "A title image with three liquid glass elements"
    path: doc/screenshot.png  

topics:
  - liquid-glass
  - apple
  - shaders
  - flutter
  - effects

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.32.4"

# We only support Platforms that support Impeller.
platforms:
  macos:
  ios:
  android:

dependencies:
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_shaders: ^0.1.3
  logging: ^1.3.0
  meta: ^1.16.0
  motor: ^1.0.1

dev_dependencies:
  alchemist: ^0.12.1
  flutter_test:
    sdk: flutter
  lintervention: ^0.3.1
  mocktail: ^1.0.3

flutter:
  # Not bundled for web. impellerc in Flutter 3.4x validates the SkSL it generates,
  # three of these shaders produce invalid SkSL (array parameters in sdf.glsl, a
  # non-constant loop initialiser in liquid_glass_arbitrary.frag), and for web SkSL
  # is the only target, so `flutter build web` fails outright. Web renders fake
  # glass and never loads them. On every other platform the tool retries without
  # SkSL and only warns. Map-style entries need a Flutter 3.4x tool: 3.38 accepts
  # strings only and would drop the shaders.
  shaders:
    - path: lib/assets/shaders/liquid_glass_geometry_blended.frag
      platforms: [android, ios, macos, windows, linux]
    - path: lib/assets/shaders/liquid_glass_filter.frag
      platforms: [android, ios, macos, windows, linux]
    - path: lib/assets/shaders/liquid_glass_arbitrary.frag
      platforms: [android, ios, macos, windows, linux]
    - path: lib/assets/shaders/liquid_glass_final_render.frag
      platforms: [android, ios, macos, windows, linux]
